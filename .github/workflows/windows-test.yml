name: Windows PDD validation build

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-pdd-build]
    paths:
      - .github/workflows/windows-test.yml

permissions:
  contents: read

concurrency:
  group: windows-pdd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      FIREFOX_REV: cebc55aab4d2661d1f6c2d1526362947ec4016c1
      MOZ_SOURCE_REPO: https://github.com/${{ github.repository }}
      MOZ_SOURCE_CHANGESET: ${{ github.sha }}
      MOZILLABUILD: 'C:\mozilla-build\'
      MOZBUILD_STATE_PATH: 'D:/mozbuild'
      CHERE_INVOKING: '1'
      MOZ_AUTOMATION: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Normalize checkout line endings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false
          git checkout -- .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/setup-nasm@v1
      - name: Export NASM path for MSYS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nasm = Get-Command nasm -ErrorAction Stop
          "MOZ_NASM_BIN=$($nasm.Source | Split-Path -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Agent sidebar
        working-directory: additions/browser/components/agent-sidebar
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s content/agent-sidebar.bundle.js
          test -s modules/PageAccessibility.sys.mjs
      - name: Install MozillaBuild on runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup-4.2.1.exe'
          Invoke-WebRequest 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/S','/D=C:\mozilla-build' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "MozillaBuild installation failed: $($process.ExitCode)" }
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin\bash.exe')) { throw 'MozillaBuild shell missing' }
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Add Windows native toolchain to PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools are not installed on the runner' }
          $vcbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC\*\bin\Hostx64\x64') -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          $llvmCandidates = @((Join-Path $vs 'VC\Tools\Llvm\x64\bin'), 'C:\Program Files\LLVM\bin')
          $llvm = $llvmCandidates | Where-Object { Test-Path (Join-Path $_ 'clang-cl.exe') } | Select-Object -First 1
          $sdkbin = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64' -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($path in @($llvm, $vcbin.FullName, $sdkbin.FullName)) {
            if (-not $path -or -not (Test-Path $path)) {
              Write-Output "::error title=Toolchain path missing::$path"
              throw "Toolchain path missing: $path"
            }
            $path | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            $env:Path = "$path;$env:Path"
          }
          "MOZ_LLVM_BIN=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOZ_VC_BIN=$($vcbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MOZ_SDK_BIN=$($sdkbin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          clang-cl --version
          link /? | Select-Object -First 1
      - name: Prepare Windows App SDK runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-app-sdk'
          $nupkg = Join-Path $env:RUNNER_TEMP 'windows-app-sdk-runtime.nupkg'
          $expanded = Join-Path $env:RUNNER_TEMP 'windows-app-sdk-nupkg'
          $runtime = Join-Path $root 'runtime'
          $msixZip = Join-Path $root 'runtime.zip'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.windowsappsdk.runtime/1.8.260921001/microsoft.windowsappsdk.runtime.1.8.260921001.nupkg' -OutFile $nupkg
          Expand-Archive -LiteralPath $nupkg -DestinationPath $expanded -Force
          $msix = Join-Path $expanded 'tools\MSIX\win10-x64\Microsoft.WindowsAppRuntime.1.8.msix'
          if (-not (Test-Path $msix)) { throw "Windows App SDK MSIX missing: $msix" }
          Copy-Item $msix $msixZip -Force
          Expand-Archive -LiteralPath $msixZip -DestinationPath $runtime -Force
          if (-not (Get-ChildItem $runtime -Recurse -File | Select-Object -First 1)) { throw 'Windows App SDK runtime is empty' }
          "MOZ_WINDOWS_APP_SDK_DIR=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Prepare winchecksec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'winchecksec'
          $zip = Join-Path $env:RUNNER_TEMP 'winchecksec.zip'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest 'https://github.com/trailofbits/winchecksec/releases/download/v3.1.0/windows.x64.Release.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $exe = Get-ChildItem $root -Recurse -Filter 'winchecksec.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'winchecksec.exe missing from release archive' }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "WINCHECKSEC_BIN=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe.FullName --help | Select-Object -First 1
      - name: Prepare pinned Firefox source
        shell: 'C:\mozilla-build\msys2\usr\bin\bash.exe --login -e -o pipefail {0}'
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")"
          git config --global core.autocrlf false
          git config --global core.longpaths true
          export UPSTREAM_REF="$FIREFOX_REV"
          bash scripts/bootstrap.sh
          test "$(git -C upstream rev-parse HEAD)" = "$FIREFOX_REV"
          bash scripts/apply-patches.sh
      - name: Validate branding assets
        shell: pwsh
        run: node scripts/check-branding-assets.mjs upstream
      - name: Bootstrap and build Windows x64
        shell: 'C:\mozilla-build\msys2\usr\bin\bash.exe --login -e -o pipefail {0}'
        run: |
          set -euo pipefail
          cd "$(cygpath -u "$GITHUB_WORKSPACE")/upstream"
          export PATH="$(cygpath -u "$MOZ_LLVM_BIN"):$PATH"
          export PATH="$(cygpath -u "$MOZ_VC_BIN"):$PATH"
          export PATH="$(cygpath -u "$MOZ_SDK_BIN"):$PATH"
          export PATH="$(cygpath -u "$MOZ_NASM_BIN"):$PATH"
          export PATH="$(cygpath -u "$WINCHECKSEC_BIN"):$PATH"
          export CC=clang-cl
          export CXX=clang-cl
          set +e
          ./mach --no-interactive bootstrap --application-choice browser 2>&1 | tee bootstrap.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            detail=$(tail -n 30 bootstrap.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=mach bootstrap failed::$detail"
            exit "$rc"
          fi
          set -e
          # Full native build; artifact mode cannot validate our C++ patches.
          printf '%s\n' 'ac_add_options --enable-application=browser' 'ac_add_options --target=x86_64-pc-windows-msvc' 'ac_add_options --enable-bootstrap=-dxc' 'ac_add_options --without-wasm-sandboxed-libraries' 'ac_add_options --with-branding=browser/branding/unofficial' 'ac_add_options --disable-debug-symbols' 'ac_add_options --disable-tests' 'mk_add_options MOZ_MAKE_FLAGS=-j2' > .mozconfig
          export MOZ_BUILD_DATE="$(date -u +%Y%m%d%H%M%S)"
          echo "EXPECTED_BUILD_ID=$MOZ_BUILD_DATE" >> "$(cygpath -u "$GITHUB_ENV")"
          set +e
          ./mach configure 2>&1 | tee configure.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            detail=$(tail -n 30 configure.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=mach configure failed::$detail"
            exit "$rc"
          fi
          set -e
          objdir=$(./mach environment --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["topobjdir"])')
          objdir=$(cygpath -u "$objdir")
          python3 ../scripts/verify-branding.py --objdir "$objdir"
          ./mach build
          ./mach package
          python3 ../scripts/verify-branding.py --package "$objdir/dist/firefox"
          mkdir -p ../candidate
          shopt -s nullglob globstar
          packages=("$objdir"/dist/firefox-*.zip "$objdir"/dist/install/**/firefox-*.zip)
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" ../candidate/firefox-reverse-v0.26.1-windows-x86_64.zip
      - name: Verify exact Windows package
        shell: pwsh
        env:
          RELEASE_TAG: v0.26.1
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $package = 'candidate/firefox-reverse-v0.26.1-windows-x86_64.zip'
          $env:PACKAGE_SHA256 = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$($env:PACKAGE_SHA256)  firefox-reverse-v0.26.1-windows-x86_64.zip" | Set-Content candidate/SHA256SUMS.txt
          @{sourceCommit=$env:SOURCE_COMMIT;upstreamCommit=$env:FIREFOX_REV;buildId=$env:EXPECTED_BUILD_ID;sha256=$env:PACKAGE_SHA256} | ConvertTo-Json | Set-Content candidate/build.json
          python scripts/verify-windows-package.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows native validation failed' }
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-reverse-windows-x86_64-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-report-${{ github.sha }}
          path: |
            native-report/
            upstream/obj-*/config.log
            upstream/obj-*/mozconfig.json
          retention-days: 14
